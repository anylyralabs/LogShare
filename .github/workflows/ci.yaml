name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    name: Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    services:
      mongo:
        image: mongo:7.0
        ports: [27017:27017]
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, zlib, mongodb, redis, pcntl, posix, sockets, swoole, brotli
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php-version }}-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy Config
        run: cp Config.inc.example.php Config.inc.php

      - name: Initialize MongoDB Indexes, TTL & AutoCompact
        run: php scripts/init_mongodb.php
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: logshare

      - name: Run Tests
        if: matrix.php-version != '8.4'
        run: composer test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: logshare
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run Tests with Coverage
        if: matrix.php-version == '8.4'
        run: composer test:coverage
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: logshare
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Verify Coverage Report
        if: matrix.php-version == '8.4'
        run: test -s coverage/clover.xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: matrix.php-version == '8.4'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/clover.xml
          fail_ci_if_error: false

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, json, zlib, mongodb, swoole
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy Config
        run: cp Config.inc.example.php Config.inc.php

      - name: Run PHPStan
        run: composer stan

  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, json, zlib, mongodb, swoole
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy Config
        run: cp Config.inc.example.php Config.inc.php

      - name: Run Architecture Tests
        run: composer test:architecture

  hyperf-boot:
    name: Hyperf Boot (Swoole)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        ports: [27017:27017]
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, json, zlib, mongodb, redis, pcntl, posix, sockets, swoole
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-swoole-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-swoole-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy Config
        run: cp Config.inc.example.php Config.inc.php

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gotask/go.mod
          cache-dependency-path: gotask/go.sum

      - name: Build GoTask Sidecar
        run: |
          cd gotask
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o ../bin/logshare-gotask ./cmd/logshare-gotask

      - name: Initialize MongoDB Indexes, TTL & AutoCompact
        run: php scripts/init_mongodb.php
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: logshare

      - name: Verify Framework Boots
        run: php bin/hyperf.php list

      - name: Start Server & Smoke Test
        run: |
          php bin/hyperf.php start > /tmp/hyperf.log 2>&1 &
          sleep 15
          php scripts/ci_e2e_test.php --base-url=http://127.0.0.1:9501 --large-file || {
            echo '=== hyperf.log ==='
            cat /tmp/hyperf.log
            exit 1
          }
          kill $(cat runtime/hyperf.pid)
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: logshare
          MONGODB_DRIVER: gotask
          GOTASK_ENABLE: "true"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, static-analysis, architecture, hyperf-boot]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # compose.yaml 的必填变量（hyperf/redis/mongo）在 build 插值阶段即校验，
    # CI 仅做构建与冒烟测试，使用占位密码即可
    env:
      MONGO_ROOT_PASSWORD: ci-placeholder
      MONGO_PASSWORD: ci-placeholder
      REDIS_PASSWORD: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 冒烟测试经 nginx 挂载 OpenLiteWaf（submodule）的 Lua 文件，
          # 必须一并检出，否则挂载源为空目录导致 WAF/统计页全部失效
          submodules: recursive

      - name: Build Image
        run: docker compose -f docker/compose.yaml build

      - name: Prepare Config for Smoke Test
        run: |
          cp Config.inc.example.php Config.inc.php
          cp .env.example .env
          sed -i 's/change-me/ci-placeholder/g' .env
          # OpenLiteWaf 解封端点令牌：nginx 与冒烟测试脚本必须取到同一个值，
          # 否则 /security/unban 一律 404，运行时解封通道就没有被真正验证过
          echo "OPENLITEWAF_ADMIN_TOKEN=ci-openlitewaf-token" >> .env
          cp .env docker/.env

      - name: Generate Self-Signed Certificate for Smoke Test
        # nginx 443 与 healthcheck 需要证书文件；CI 上 docker/certs/ 为空。
        # 域名从 default.conf 的证书路径动态提取，避免仓库域名调整后
        # CI 仍生成旧域名的证书导致 nginx 启动失败
        run: |
          DOMAIN=$(sed -n 's#.*live/\([^/]*\)/fullchain.pem.*#\1#p' docker/nginx/default.conf | head -1)
          if [ -z "$DOMAIN" ]; then
            echo "无法从 docker/nginx/default.conf 提取证书域名"; exit 1
          fi
          echo "生成自签证书: $DOMAIN"
          mkdir -p "docker/certs/live/$DOMAIN"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "docker/certs/live/$DOMAIN/privkey.pem" \
            -out "docker/certs/live/$DOMAIN/fullchain.pem" \
            -days 1 -subj "/CN=$DOMAIN"

      - name: Test Image Starts & Run E2E Suite
        run: |
          docker compose --env-file .env -f docker/compose.yaml up -d || {
            echo "=== docker compose up -d 失败，输出全部容器日志 ==="
            docker compose --env-file .env -f docker/compose.yaml logs
            docker compose --env-file .env -f docker/compose.yaml down
            exit 1
          }
          ready=0
          for i in $(seq 1 30); do
            if curl -skf https://localhost/v1/limits > /dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "=== 服务启动超时，输出容器日志 ==="
            docker compose --env-file .env -f docker/compose.yaml logs
            docker compose --env-file .env -f docker/compose.yaml down
            exit 1
          fi
          # 执行涵盖 Nginx 反代、HTTPS、OpenLiteWaf 防护与 OpenLiteStats 的全量真实环境测试
          # OPENLITEWAF_ADMIN_TOKEN 与写入 .env 的值保持一致，供解封通道自检断言使用
          OPENLITEWAF_ADMIN_TOKEN=ci-openlitewaf-token \
            php scripts/ci_e2e_test.php --base-url=https://localhost --waf-test --large-file || {
            echo '=== 测试失败，输出容器日志 ==='
            docker compose --env-file .env -f docker/compose.yaml logs
            docker compose --env-file .env -f docker/compose.yaml down
            exit 1
          }
          echo "Docker 真实生产环境全量 E2E 测试全部通过"
          docker compose --env-file .env -f docker/compose.yaml down
