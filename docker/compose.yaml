# 统一日志上限：默认 json-file 无限制，长期运行可占满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  nginx:
    logging: *default-logging
    # OpenResty = Nginx + lua-nginx-module，OpenLiteWaf（../OpenLiteWaf/）运行其上；
    # 版本固定，升级时同步检查 OpenLiteWaf/nginx/nginx.conf 与镜像内置配置的差异
    image: openresty/openresty:1.27.1.2-alpine
    container_name: logshare-nginx
    environment:
      # /security/unban 与 /security/bans 的运维令牌。
      # 需配合 OpenLiteWaf/nginx/nginx.conf 的 `env` 指令才会出现在 Lua 的 os.getenv 里
      OPENLITEWAF_ADMIN_TOKEN: ${OPENLITEWAF_ADMIN_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      # OpenLiteWaf：主配置（http 级 lua 指令）与 Lua 模块，详见 OpenLiteWaf/README.md
      - ../OpenLiteWaf/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../OpenLiteWaf/lua:/usr/local/openresty/nginx/lua:ro
      # OpenLiteWaf 快照持久化目录（计数/攻击日志/封禁名单，重启恢复）
      - ../OpenLiteWaf/data:/data/openlitewaf
      # OpenLiteStats：站点访问统计，详见 OpenLiteStats/README.md
      - ../OpenLiteStats/lua:/usr/local/openresty/nginx/lstats:ro
      - ../OpenLiteStats/data:/data/openlitestats
      - ./certs:/etc/letsencrypt:ro
      - ./acme:/var/www/acme:ro
    depends_on:
      - hyperf
    networks:
      - logshare-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      # 探测 /security（nginx Lua 直接响应，不依赖 hyperf）。
      # 探测会使 OpenLiteWaf 累计请求计数每 30s +1，属预期行为
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/security"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  acme:
    logging: *default-logging
    image: certbot/certbot:v2.11.0
    container_name: logshare-acme
    volumes:
      - ./certs:/etc/letsencrypt:rw
      - ./acme:/var/www/acme:rw
    networks:
      - logshare-network
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/acme --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

  hyperf:
    logging: *default-logging
    container_name: logshare-hyperf
    build:
      context: ..
      dockerfile: docker/hyperf.Dockerfile
      args:
        SWOOLE_VERSION: ${SWOOLE_VERSION:-6.2.0}
    expose:
      - "9501"
    volumes:
      # 映射表只读挂载：宿主机目录为空时反混淆全透传（返回原文，属预期降级），部署前请确认映射表已下载
      - ../mappings:/app/mappings:ro
      - ../OpenLiteWaf/data:/app/OpenLiteWaf/data:ro
      # 完整业务配置（数据库密码、生产域名等）挂载到容器内，
      # 文件不存在时自动回退 Config.inc.example.php；该文件已被 .gitignore 排除
      - ../Config.inc.php:/app/Config.inc.php:ro
      - ../.env:/app/.env:ro
      - ../runtime:/app/runtime
    environment:
      APP_ENV: prod
      SCAN_CACHEABLE: "true"
      MONGODB_URI: "mongodb://logshare:${MONGO_PASSWORD:?MONGO_PASSWORD must be set}@mongo:27017/?authSource=logshare"
      MONGODB_DATABASE: logshare
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # 边缘 WAF 解封令牌的调用方（E2E/运维脚本可经 docker exec -e 注入）。
      # OpenLiteWaf/data 保持只读挂载：应用容器不需要、也不应有权改写 nginx 的权威状态文件
      OPENLITEWAF_ADMIN_TOKEN: ${OPENLITEWAF_ADMIN_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logshare-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      # 容器内不依赖 curl，用 PHP 本体探测 HTTP 端口；显式 3s 网络超时，
      # 避免服务 hang 时探针阻塞到 PHP 默认 socket 超时
      test: ["CMD", "php", "-r", "exit((int) (@file_get_contents('http://127.0.0.1:9501/v1/limits', false, stream_context_create(['http' => ['timeout' => 3]])) === false));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongo:
    logging: *default-logging
    image: mongo:7.0
    container_name: logshare-mongo
    # MongoDB 7.0 兼容 ARM64 39-bit VA 内核（8.0 的 TCMalloc 在该环境会启动失败）。
    # TTL 删除后的磁盘回收由 Hyperf 的 MongoCompactProcess 周期性 compact 兜底；
    # MongoDB 8.0 且账号具备权限时会优先使用内置 autoCompact。
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_INITDB_DATABASE: logshare
      MONGO_APP_USERNAME: logshare
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - logshare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  redis:
    logging: *default-logging
    image: redis:7.4-alpine
    container_name: logshare-redis
    # 与 hyperf 的 REDIS_PASSWORD 保持一致，始终启用 requirepass
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    networks:
      - logshare-network
    restart: unless-stopped
    healthcheck:
      # 启用 requirepass 后未认证的 ping 会收到 NOAUTH，探测经 REDISCLI_AUTH 传密避免 ps 泄露
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  redis-data:
    name: logshare-redis-data
  mongo-data:
    name: logshare-mongo-data

networks:
  logshare-network:
    name: logshare-network
