        Returns configured max bytes, max lines, and storage TTL
        
        (Deprecated; use /v1/limits instead)
      operationId: getLimits
      deprecated: true
      responses:
        '200':
          description: Limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsResponse'
              example:
                maxLength: 10485760
                maxLines: 50000
                storageTime: 604800
        '429':
