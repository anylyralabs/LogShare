  /v1/telemetry/report:
    post:
      tags: [Meta]
      summary: Report client telemetry metrics
      description: |
        Accepts a batch of client-side telemetry items (`items` array), a bare
        JSON array, or a single item object. Each item is one of `api`,
        `web_vitals` or `error`. Batches are capped at 50 items per request;
        endpoint paths are truncated to 200 chars and the endpoint leaderboard
        caps at 2000 distinct keys per day (overflow is folded into `:other`).
      operationId: reportTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Metrics recorded
          content:
            application/json:
              schema:
                type: object
                properties:
