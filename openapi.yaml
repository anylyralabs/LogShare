components:
  schemas:
    IndexResponse:
      type: object
      required: [success, message, endpoints]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "LogShare API"
        endpoints:
          type: array
          items:
            type: string
    LogCreateResponse:
      type: object
      required: [success, message, id, url, raw, token, deduplicated]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Log submitted successfully"
        id:
          type: string
          pattern: '^[a-zA-Z0-9]{7}$'
          example: "sAbCdEf"
        url:
          type: string
          format: uri
          example: "https://logshare.cn/sAbCdEf"
        raw:
          type: string
          format: uri
          example: "https://api.logshare.cn/1/raw/sAbCdEf"
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Deletion token (SHA-256-sized hex string). Save it — it cannot be recovered.
          example: "3f9c1a7d5e2b8046c1d9f3a70b5e28461c7a9d0e3f5b8124c6d7e9f0a1b2c3d4"
        deduplicated:
          type: boolean
          description: |
            `true` when the upload matched an existing content fingerprint. In that
            case the returned `token` was never stored and cannot delete the log;
            use the token from the original upload.
          example: false
    LogDeleteResponse:
      type: object
      required: [success, message, deleted, failed, total, deletedCount, failedCount]
      properties:
        success:
          type: boolean
        message:
          type: string
        deleted:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            required: [id, message, code]
            properties:
              id:
                type: string
              message:
                type: string
              code:
                type: integer
        total:
          type: integer
        deletedCount:
          type: integer
        failedCount:
          type: integer
    AnalysisResponse:
      type: object
      description: Full Codex analysis result (varies by log type)
      properties:
        success:
          type: boolean
        message:
          type: string
        analysis:
          type: object
          additionalProperties: true
    InsightsResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            lineCount:
              type: integer
            errorCount:
              type: integer
            version:
              type: string
            modLoader:
              type: string
            mods:
              type: array
              items:
                type: object
            entries:
              type: array
              items:
                type: object
    LimitsResponse:
      type: object
      required: [maxLength, maxLines, storageTime]
      properties:
        maxLength:
          type: integer
          description: Max upload bytes
          example: 10485760
        maxLines:
          type: integer
          example: 50000
        storageTime:
          type: integer
          description: TTL in seconds
          example: 604800
    MetadataEntry:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          maxLength: 100
        value:
          type: string
          maxLength: 500
    ErrorResponse:
      type: object
      required: [success, error, code]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: integer
        errors:
          type: array
          items:
            type: object
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Missing required field: content"
            code: 400
    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Missing token in Authorization header. Use: Bearer <token>"
            code: 401
    Forbidden:
      description: Token mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Invalid token for log: sAbCdEf"
            code: 403
    NotFound:
      description: Log not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Log not found: sAbCdEf"
            code: 404
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until reset
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Rate limit exceeded. Please try again later."
            code: 429
    PayloadTooLarge:
      description: Request body exceeds limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Request body exceeds 10 MB limit"
            code: 413
