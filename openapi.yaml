  /1/analyse:
    post:
      tags: [Analysis]
      summary: Analyse log content without storing
      description: |
        Runs full Codex analysis (version detection, mod detection, crash parsing, etc.)
        on the provided content without persisting it. Returns structured analysis result.
        
        (Deprecated; use /v1/analyse instead)
      operationId: analyseLog
      deprecated: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/analyse:
    post:
      tags: [Analysis]
      summary: Analyse log content without storing
      description: |
        Runs full Codex analysis (version detection, mod detection, crash parsing, etc.)
