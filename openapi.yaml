                  created: { type: integer, nullable: true }
                  expires: { type: integer, nullable: true }
                  metadata: { type: array, items: { $ref: '#/components/schemas/MetadataEntry' } }
                  source: { type: string, nullable: true }
                  files:
                    type: array
                    items:
