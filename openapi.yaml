                      limit: 50000
                  - type: regex
                    data:
                      patterns:
                        - pattern: IPv4
                          replacement: "**.**.**.**"
                        - pattern: IPv6
                          replacement: "****:****:****:****:****:****:****:****"
                        - pattern: IPv6Short
                          replacement: "****:****:****:****:****:****:****:****"
                        - pattern: Uuid
                          replacement: "********-****-****-****-************"
                        - pattern: Xuid
                          replacement: "xuid:\"****************\""
                        - pattern: SessionToken
                          replacement: "accessToken:\"********\""
                        - pattern: ClientId
