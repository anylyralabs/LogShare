  /v1/errors/rate:
    get:
      tags: [Meta]
      summary: Rate-limit error probe
      description: |
        Always returns `429 Too Many Requests` with a `Retry-After` header.
        It exists so clients can exercise their rate-limit error handling; it
        does **not** report counters. Actual limits are enforced at the edge:
        nginx `limit_req` (30 r/s, burst 60) plus OpenLiteWaf CC defense
        (240 requests / 10 s window).
      operationId: getRateLimitStatusV1
      responses:
